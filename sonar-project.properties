# =============================================
# SONARQUBE - Yvy Porá / Ingeniería III
# Colocar este archivo en la RAÍZ del proyecto
# =============================================

sonar.projectKey=yvy-pora-ingenieria-iii
sonar.projectName=Yvy Porá - Ingeniería III
sonar.projectVersion=1.0.0
sonar.organization=${SONAR_ORGANIZATION}

# URL del servidor SonarQube (se pasa desde secretos en CI/CD)
# Para desarrollo local: http://localhost:9000
sonar.host.url=${SONAR_HOST_URL}
sonar.token=${SONAR_TOKEN}

# Carpeta con el código fuente a analizar
sonar.sources=JS

# Carpeta con los tests (excluida del análisis de bugs)
sonar.tests=JS
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Archivos a ignorar en el análisis
sonar.exclusions=**/node_modules/**,coverage/**,public/**,styles/**

# Reporte de cobertura generado por Jest (lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Codificación del proyecto
sonar.sourceEncoding=UTF-8
