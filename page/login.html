<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yvy Porã — Ingresar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Lato:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/login.css" />
  </head>
  <body>
    <div class="bg-left">
      <div class="brand-panel">
        <div class="logo-wrap">
          <img src="../public/assets/fonts/img/mascota.png" alt="Yvy Porã logo" class="logo-img" />
        </div>
        <p class="brand-tagline">Tierra buena<br />Guía para tu huerta urbana</p>
        <div class="deco-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="bg-right">
      <div class="form-panel">
        <div class="form-header">
          <h1>Bienvenido/a</h1>
          <p>Ingresá con tu cuenta para continuar</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="field-group" id="group-usuario">
            <label for="usuario">Usuario</label>
            <div class="input-wrap">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
              </svg>
              <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Ej: admin"
                autocomplete="username"
                required
              />
            </div>
            <span class="field-error" id="error-usuario"></span>
          </div>

          <div class="field-group" id="group-password">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              >
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 0 1 8 0v4" />
              </svg>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="toggle-pass"
                id="togglePass"
                aria-label="Mostrar contraseña"
              >
                <svg
                  id="eyeIcon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <span class="field-error" id="error-password"></span>
          </div>

          <div class="alert-error" id="alertError">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span id="alertMsg">Usuario o contraseña incorrectos</span>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmit">
            <span class="btn-text">Ingresar</span>
            <span class="btn-spinner" id="spinner"></span>
          </button>
        </form>

        <p class="form-hint">¿Olvidaste tu contraseña?</p>

        <a class="back-home" href="../index.html">Volver al inicio</a>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
